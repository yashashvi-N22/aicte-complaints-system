version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aicte_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicte_user
      POSTGRES_PASSWORD: aicte_secure_2026
      POSTGRES_DB: aicte_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicte_user -d aicte_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicte_backend_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://aicte_user:aicte_secure_2026@db:5432/aicte_db
      - SECRET_KEY=aicte_super_secret_jwt_key_gov_portal_2026_x98z
      - APP_ENV=production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head || true &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicte_frontend_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
